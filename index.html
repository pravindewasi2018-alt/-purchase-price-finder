<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Price Finder</title>
    <style>
        body{font-family:Arial;margin:0;background:#f2f2f2}
        .box{max-width:500px;margin:auto;background:white;padding:20px}
        h2{text-align:center}
        input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box}
        input{border:1px solid #ccc}
        button{border:0;background:#111;color:white}
        .item{padding:12px;margin-top:8px;background:#f9f9f9;border:1px solid #eee}
        .price{font-weight:bold;font-size:18px}
        .del{background:#d00;margin-top:5px}
        .btn-share{background:#25D366;font-size:16px;font-weight:bold;margin-top:15px;cursor:pointer}
    </style>
</head>
<body>

<div class="box">
    <h2>Purchase Price Finder</h2>
    <input id="model" placeholder="Model">
    <input id="price" type="number" placeholder="Purchase Price">
    <button onclick="save()">Save / Update</button>
    <input id="search" placeholder="Search Model" onkeyup="searchModel()">
    <div id="list"></div>
    
    <!-- पूरी लिस्ट एक साथ WhatsApp पर भेजने का बटन -->
    <button class="btn-share" onclick="shareOnWhatsApp()">🟢 पूरी लिस्ट WhatsApp पर भेजें</button>
</div>

<script>
// आपकी पुरानी ऐप का ओरिजिनल लॉजिक
var list = [];
if(localStorage.getItem("list")!=null){
    list = JSON.parse(localStorage.getItem("list"));
    show();
}

function save(){
    var m = document.getElementById("model").value.trim();
    var p = document.getElementById("price").value.trim();
    if(m=="" || p==""){
        alert("Enter Model & Price");
        return;
    }
    var f = 0;
    for(var i=0; i<list.length; i++){
        if(list[i].model.toLowerCase() == m.toLowerCase()){
            list[i].price = p;
            f = 1;
        }
    }
    if(f==0){
        list.push({model:m, price:p});
    }
    localStorage.setItem("list", JSON.stringify(list));
    show();
    document.getElementById("model").value = "";
    document.getElementById("price").value = "";
}

function show(){
    var h = "";
    for(var i=list.length-1; i>=0; i--){
        h += "<div class='item'><b>"+list[i].model+"</b><br><span class='price'>₹"+parseFloat(list[i].price).toLocaleString('en-IN')+"</span><br><button class='del' onclick='del("+i+")'>Delete</button></div>";
    }
    document.getElementById("list").innerHTML = h;
}

function del(i){
    if(confirm("Delete this item?")){
        list.splice(i,1);
        localStorage.setItem("list", JSON.stringify(list));
        show();
    }
}

function searchModel(){
    var s = document.getElementById("search").value.toLowerCase();
    var h = "";
    for(var i=list.length-1; i>=0; i--){
        if(list[i].model.toLowerCase().includes(s)){
            h += "<div class='item'><b>"+list[i].model+"</b><br><span class='price'>₹"+parseFloat(list[i].price).toLocaleString('en-IN')+"</span><br><button class='del' onclick='del("+i+")'>Delete</button></div>";
        }
    }
    document.getElementById("list").innerHTML = h;
}

// पूरी लिस्ट को WhatsApp पर फॉरवर्ड करने का नया फंक्शन
function shareOnWhatsApp() {
    if (list.length === 0) {
        alert("आपकी लिस्ट खाली है!");
        return;
    }

    let message = `📋 *परचेज प्राइस लिस्ट (Purchase Price List)*\n`;
    message += `-----------------------------------\n`;

    let total = 0;

    // ओरिजिनल लिस्ट एरे से डेटा लेकर मैसेज फॉर्मेट करना
    list.forEach((item, index) => {
        message += `${index + 1}. *${item.model}* - ₹${parseFloat(item.price).toLocaleString('en-IN')}\n`;
        total += parseFloat(item.price);
    });

    message += `-----------------------------------\n`;
    message += `💰 *कुल टोटल (Grand Total):* ₹${total.toLocaleString('en-IN')}\n\n`;
    message += `_यह लिस्ट परचेज प्राइस फाइंडर ऐप से शेयर की गई है।_`;

    const whatsappUrl = `https://whatsapp.com{encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
}
</script>

</body>
</html>
