<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Price Finder</title>
    <style>
        body{font-family:Arial, sans-serif;margin:0;background:#f2f2f2;padding:10px;}
        .box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
        h2{text-align:center;color:#333;}
        input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;display:block;}
        input{border:1px solid #ccc;border-radius:4px;font-size:16px;}
        button{border:0;background:#111;color:white;font-weight:bold;border-radius:4px;cursor:pointer;font-size:16px;}
        .item{padding:12px;margin-top:8px;background:#f9f9f9;border:1px solid #eee;border-radius:4px;}
        .price{font-weight:bold;font-size:18px;color:#111;}
        .del{background:#d00;margin-top:8px;width:100%;padding:8px;}
        .btn-share{background:#25D366;color:white;font-size:16px;font-weight:bold;margin-top:15px;border:none;border-radius:4px;width:100%;padding:14px;cursor:pointer;}
    </style>
</head>
<body>

<div class="box">
    <h2>Purchase Price Finder</h2>
    <input id="model" placeholder="Model">
    <input id="price" type="number" placeholder="Purchase Price">
    <button onclick="save()">Save / Update</button>
    <input id="search" placeholder="Search Model" onkeyup="searchModel()">
    <div id="list"></div>
    
    <!-- यहाँ साधारण बटन का इस्तेमाल किया गया है जो आईफोन में कभी ब्लॉक नहीं होता -->
    <button class="btn-share" onclick="shareOnWhatsApp()">🟢 पूरी लिस्ट WhatsApp पर भेजें</button>
</div>

<script>
var list = [];
if(localStorage.getItem("list") != null){
    list = JSON.parse(localStorage.getItem("list"));
    show();
}

function save(){
    var m = document.getElementById("model").value.trim();
    var p = document.getElementById("price").value.trim();
    if(m == "" || p == ""){
        alert("Enter Model & Price");
        return;
    }
    var f = 0;
    for(var i=0; i<list.length; i++){
        if(list[i].model.toLowerCase() == m.toLowerCase()){
            list[i].price = p;
            f = 1;
        }
    }
    if(f == 0){
        list.push({model:m, price:p});
    }
    localStorage.setItem("list", JSON.stringify(list));
    show();
    document.getElementById("model").value = "";
    document.getElementById("price").value = "";
}

function show(){
    var h = "";
    for(var i=list.length-1; i>=0; i--){
        h += "<div class='item'><b>"+list[i].model+"</b><br><span class='price'>₹"+parseFloat(list[i].price).toLocaleString('en-IN')+"</span><br><button class='del' onclick='del("+i+")'>Delete</button></div>";
    }
    document.getElementById("list").innerHTML = h;
}

function del(i){
    if(confirm("Delete this item?")){
        list.splice(i,1);
        localStorage.setItem("list", JSON.stringify(list));
        show();
    }
}

function searchModel(){
    var s = document.getElementById("search").value.toLowerCase();
    var h = "";
    for(var i=list.length-1; i>=0; i--){
        if(list[i].model.toLowerCase().includes(s)){
            h += "<div class='item'><b>"+list[i].model+"</b><br><span class='price'>₹"+parseFloat(list[i].price).toLocaleString('en-IN')+"</span><br><button class='del' onclick='del("+i+")'>Delete</button></div>";
        }
    }
    document.getElementById("list").innerHTML = h;
}

// यह नया फंक्शन बिना किसी एरर के सीधा यूनिवर्सल लिंक खोलेगा
function shareOnWhatsApp() {
    if (list.length === 0) {
        alert("आपकी लिस्ट खाली है! पहले कुछ आइटम जोड़ें।");
        return;
    }

    var message = "📋 *परचेज PRICE लिस्ट*\n";
    message += "-----------------------------------\n";

    var total = 0;

    for (var i = 0; i < list.length; i++) {
        message += (i + 1) + ". *" + list[i].model + "* - ₹" + parseFloat(list[i].price).toLocaleString('en-IN') + "\n";
        total += parseFloat(list[i].price);
    }

    message += "-----------------------------------\n";
    message += "💰 *कुल टोटल:* ₹" + total.toLocaleString('en-IN') + "\n\n";
    message += "_यह लिस्ट परचेज प्राइस फाइंडर ऐप से शेयर की गई है।_";

    // यूनिवर्सल वेब लिंक जो हर जगह (Android, iOS, Web) काम करता है
    var whatsappUrl = "https://whatsapp.com" + encodeURIComponent(message);
    
    // आईफोन सफारी के लिए सबसे सुरक्षित तरीका
    window.location.href = whatsappUrl;
}
</script>

</body>
</html>
