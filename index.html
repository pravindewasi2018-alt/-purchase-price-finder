<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase Price Finder</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f7;padding:20px}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:18px}
h2{text-align:center}
input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:10px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#111;color:white;cursor:pointer;font-weight:bold;}

/* नया पीडीएफ डाउनलोड बटन */
.btn-pdf{background:#28a745 !important; color:white; margin-bottom:12px;}

/* 1. मॉडल बॉक्स को छोटा और आमने-सामने करने के लिए CSS */
.item{
 display:flex !important;
 justify-content:space-between !important;
 align-items:center !important;
 padding:8px 12px !important;
 margin-top:6px !important;
 background:#f1f1f1;
 border-radius:10px
}
.item-details{display:flex; flex-direction:column;}
.model-text{font-size:15px; color:#111;}
.price{font-weight:bold; font-size:14px; color:#333; margin-top:2px;}

/* 2. छोटा और ठीक आगे लगा हुआ गोल 'X' डिलीट बटन */
.del{
 background:#d00 !important;
 color:white !important;
 width:28px !important;
 height:28px !important;
 border-radius:50% !important;
 font-size:14px !important;
 font-weight:bold !important;
 display:flex !important;
 align-items:center !important;
 justify-content:center !important;
 margin:0 !important;
 padding:0 !important;
}

/* आईफोन प्रिंट के समय फालतू बटन छिपाने के लिए */
@media print {
  body { background: white; padding: 0; }
  .box { box-shadow: none; padding: 0; max-width: 100%; }
  input, button:not(.del), h2 { display: none !important; }
  .del { display: none !important; } /* प्रिंट में X बटन नहीं दिखेगा, सिर्फ लिस्ट दिखेगी */
  .item { border: 1px solid #ddd; background: #fff !important; page-break-inside: avoid; }
}
</style>
</head>
<body>
<div class="box">
<h2>Purchase Price Finder</h2>
<input id="model" placeholder="Model">
<input id="price" type="number" placeholder="Purchase Price ₹">
<button onclick="save()">Save / Update</button>

<!-- आईफोन के लिए स्पेशल प्रिंट/पीडीएफ बटन -->
<button class="btn-pdf" onclick="downloadPDF()">Save PDF (Full Screenshot)</button>

<input id="search" placeholder="Search Model" oninput="show()">
<div id="list"></div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("prices")||"{}");

function save(){
 let m=document.getElementById("model").value.trim().toUpperCase();
 let p=document.getElementById("price").value.trim();
 if(!m||!p)return alert("Model aur price bharo");
 data[m]=p;
 localStorage.setItem("prices",JSON.stringify(data));
 document.getElementById("model").value="";
 document.getElementById("price").value="";
 show();
}

function show(){
 let q=document.getElementById("search").value.trim().toUpperCase();
 let out="";
 Object.keys(data).filter(m=>m.includes(q)).forEach(m=>{
  out+=`<div class="item">
   <div class="item-details">
    <b class="model-text">${m}</b>
    <span class="price">₹${data[m]}</span>
   </div>
   <button class="del" onclick="del('${m}')">X</button>
  </div>`;
 });
 document.getElementById("list").innerHTML=out;
}

function del(m){
 delete data[m];
 localStorage.setItem("prices",JSON.stringify(data));
 show();
}

// 🔥 आईफोन (iPhone) के लिए स्पेशल फुल पीडीएफ मेकर फंक्शन
function downloadPDF() {
 if(Object.keys(data).length === 0) return alert("लिस्ट में कोई मॉडल नहीं है!");
 window.print(); // यह आईफोन का ओरिजिनल पीडीएफ/प्रिंट मेन्यू खोल देगा
}

show();
</script>
</body>
</html>
