<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase Price Finder</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f7;padding:20px}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:18px}
h2{text-align:center}
input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:10px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#111;color:white;cursor:pointer;font-weight:bold;-webkit-appearance:none;}

/* बटन के आकर्षक रंग */
.btn-pdf{background:#28a745 !important; color:white; margin-bottom:12px;}
.btn-plus{background:#007aff !important; color:white; width:48%; margin-right:2%; display:inline-block; padding:12px;}
.btn-minus{background:#ff9500 !important; color:white; width:48%; display:inline-block; padding:12px;}

/* बूस्टर बॉक्स डिज़ाइन */
.boost-section {
  background: #f2f2f7;
  padding: 12px;
  border-radius: 12px;
  margin: 10px 0;
  border: 1px dashed #007aff;
}
.boost-title { font-size: 14px; font-weight: bold; color: #007aff; text-align: center; margin-bottom: 5px; }
.btn-row { display: flex; justify-content: space-between; }

/* 🏢 कंपनियों के नाम की सुंदर हेडिंग */
.company-header {
  background: #007aff;
  color: white;
  padding: 8px 14px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 8px;
  margin-top: 18px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

/* मॉडल बॉक्स */
.item{
 display:flex !important;
 justify-content:space-between !important;
 align-items:center !important;
 padding:8px 12px !important;
 margin-top:6px !important;
 background:#f1f1f1;
 border-radius:10px
}
.item-details{display:flex; flex-direction:column;}
.model-text{font-size:15px; color:#111;}
.price{font-weight:bold; font-size:14px; color:#333; margin-top:2px;}

/* गोल छोटा 'X' डिलीट बटन */
.del{
 background:#d00 !important;
 color:white !important;
 width:28px !important;
 height:28px !important;
 border-radius:50% !important;
 font-size:14px !important;
 font-weight:bold !important;
 display:flex !important;
 align-items:center !important;
 justify-content:center !important;
 margin:0 !important;
 padding:0 !important;
}
</style>
</head>
<body>
<div class="box">
<h2>Purchase Price Finder</h2>
<input id="model" placeholder="Model (जैसे: MI 9POWER, VIVO Y12, OPPO A35)">
<input id="price" type="number" placeholder="Purchase Price ₹">
<button onclick="save()">Save / Update</button>

<!-- 📈/📉 कीमत बदलने का सेक्शन -->
<div class="boost-section">
  <div class="boost-title">📈/📉 सभी कीमतें एक साथ बदलें</div>
  <input id="bulkAmount" type="number" placeholder="कितने रुपये बदलना है? (जैसे: 10 या 20)">
  <div class="btn-row">
    <button class="btn-plus" onclick="updatePrices('plus')">Update (+)</button>
    <button class="btn-minus" onclick="updatePrices('minus')">Update (-)</button>
  </div>
</div>

<button class="btn-pdf" onclick="shareFullList()">Share Full List (WhatsApp)</button>

<input id="search" placeholder="Search Model" oninput="show()">
<div id="list"></div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("prices")||"{}");

function save(){
 let m=document.getElementById("model").value.trim().toUpperCase();
 let p=document.getElementById("price").value.trim();
 if(!m||!p)return alert("Model aur price bharo");
 data[m]=p;
 localStorage.setItem("prices",JSON.stringify(data));
 document.getElementById("model").value="";
 document.getElementById("price").value="";
 show();
}

// 🤖 सिर्फ पहला शब्द पढ़कर कंपनी तय करने वाला सबसे आसान सिस्टम
function getFirstWordCompany(modelName) {
  let name = modelName.toUpperCase().trim();
  let words = name.split(" ");
  let firstWord = words[0]; // नाम का सबसे पहला शब्द

  // जिन मुख्य कंपनियों को आप ऊपर रखना चाहते हैं
  let mainCompanies = ["MI", "REDMI", "VIVO", "OPPO", "SAMSUNG", "REALME", "ONEPLUS", "HONOR", "POCO", "IPHONE", "APPLE"];
  
  if (mainCompanies.includes(firstWord)) {
    return firstWord; // अगर पहला शब्द कंपनी है, तो वही हेडिंग बनेगी
  }
  
  // अगर पहला शब्द कोई नंबर या अनजान कोड है, तो वह सबसे नीचे जाएगा
  return "Z_OTHER MODELS"; 
}

function show(){
 let q=document.getElementById("search").value.trim().toUpperCase();
 let out = "";
 
 let filteredModels = Object.keys(data).filter(m => m.includes(q));
 
 let groups = {};
 filteredModels.forEach(m => {
   let comp = getFirstWordCompany(m);
   if (!groups[comp]) groups[comp] = [];
   groups[comp].push(m);
 });
 
 // कंपनियों को क्रम में सजाना (ताकि Z_OTHER MODELS अपने आप सबसे नीचे चला जाए)
 let sortedCompanies = Object.keys(groups).sort();
 
 sortedCompanies.forEach(comp => {
   // स्क्रीन पर दिखाते समय Z_ हटाकर सुंदर "OTHER MODELS" लिखेंगे
   let displayHeader = comp === "Z_OTHER MODELS" ? "OTHER MODELS" : comp;
   
   out += `<div class="company-header">${displayHeader}</div>`;
   
   groups[comp].forEach(m => {
     out += `<div class="item">
      <div class="item-details">
       <b class="model-text">${m}</b>
       <span class="price">₹${data[m]}</span>
      </div>
      <button class="del" onclick="del('${m}')">X</button>
     </div>`;
   });
 });
 
 document.getElementById("list").innerHTML = out;
}

function del(m){
 delete data[m];
 localStorage.setItem("prices",JSON.stringify(data));
 show();
}

function updatePrices(type) {
 let inputVal = document.getElementById("bulkAmount").value.trim();
 if(!inputVal) return alert("कृपया सही रुपये लिखें");
 
 let amount = Number(inputVal);
 if(isNaN(amount) || amount <= 0) return alert("कृपया सही नंबर डालें");
 
 Object.keys(data).forEach(m => {
  let currentPrice = Number(data[m]) || 0; 
  if(type === 'plus') {
    data[m] = currentPrice + amount;
  } else {
    data[m] = currentPrice - amount;
  }
 });
 
 localStorage.setItem("prices", JSON.stringify(data));
 document.getElementById("bulkAmount").value = ""; 
 show();
 alert(`सभी मॉडल्स की कीमत में बदलाव कर दिया गया है!`);
}

function shareFullList() {
 if(Object.keys(data).length === 0) return alert("लिस्ट में कोई MODEL नहीं है!");
 
 let textMessage = "📝 *Purchase Price List* 📝\n\n";
 
 let filteredModels = Object.keys(data);
 let groups = {};
 filteredModels.forEach(m => {
   let comp = getFirstWordCompany(m);
   if (!groups[comp]) groups[comp] = [];
   groups[comp].push(m);
 });
 
 Object.keys(groups).sort().forEach(comp => {
   let displayHeader = comp === "Z_OTHER MODELS" ? "OTHER MODELS" : comp;
   textMessage += `🔹 *${displayHeader}* 🔹\n`;
   groups[comp].forEach(m => {
     textMessage += `▪️ ${m} : ₹${data[m]}\n`;
   });
   textMessage += `\n`;
 });
 
 let whatsappUrl = `https://whatsapp.com{encodeURIComponent(textMessage)}`;
 
 if (navigator.share) {
  navigator.share({ text: textMessage }).catch(err => {
   window.open(whatsappUrl, '_blank');
  });
 } else {
  window.open(whatsappUrl, '_blank');
 }
}

show();
</script>
</body>
</html>
