<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase Price Finder</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f7;padding:20px}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:18px}
h2{text-align:center}
input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:10px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#111;color:white}
.item{padding:12px;margin-top:8px;background:#f1f1f1;border-radius:10px}
.price{font-weight:bold;font-size:18px}
.del{background:#d00;margin-top:5px}
</style>
</head>
<body>
<div class="box">
<h2>Purchase Price Finder</h2>
<input id="model" placeholder="Model">
<input id="price" type="number" placeholder="Purchase Price ₹">
<button onclick="save()">Save / Update</button>
<input id="search" placeholder="Search Model" oninput="show()">
<div id="list"></div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("prices")||"{}");

function save(){
 let m=document.getElementById("model").value.trim().toUpperCase();
 let p=document.getElementById("price").value.trim();
 if(!m||!p)return alert("Model aur price bharo");
 data[m]=p;
 localStorage.setItem("prices",JSON.stringify(data));
 document.getElementById("model").value="";
 document.getElementById("price").value="";
 show();
}
function show(){
 let q=document.getElementById("search").value.trim().toUpperCase();
 let out="";
 Object.keys(data).filter(m=>m.includes(q)).forEach(m=>{
  out+=`<div class="item"><b>${m}</b><br><span class="price">₹${data[m]}</span>
  <button class="del" onclick="del('${m}')">Delete</button></div>`;
 });
 document.getElementById("list").innerHTML=out;
}
function del(m){
 delete data[m];
 localStorage.setItem("prices",JSON.stringify(data));
 show();
}
show();
</script>
</body>
</html>
