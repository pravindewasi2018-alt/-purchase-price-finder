<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase Price Finder</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f7;padding:20px}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:18px}
h2{text-align:center}
input,button{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:10px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#111;color:white;cursor:pointer;font-weight:bold;-webkit-appearance:none;}

/* बटन के अलग-अलग रंग */
.btn-pdf{background:#28a745 !important; color:white; margin-bottom:12px;}
.btn-update-all{background:#007aff !important; color:white; margin-top:2px; margin-bottom:12px; padding:10px;}

/* कीमत बढ़ाने वाले सेक्शन का स्टाइल */
.boost-section {
  background: #f2f2f7;
  padding: 12px;
  border-radius: 12px;
  margin: 10px 0;
  border: 1px dashed #007aff;
}
.boost-title { font-size: 14px; font-weight: bold; color: #007aff; text-align: center; margin-bottom: 5px; }

/* 1. मॉडल बॉक्स को छोटा और आमने-सामने करने के लिए CSS */
.item{
 display:flex !important;
 justify-content:space-between !important;
 align-items:center !important;
 padding:8px 12px !important;
 margin-top:6px !important;
 background:#f1f1f1;
 border-radius:10px
}
.item-details{display:flex; flex-direction:column;}
.model-text{font-size:15px; color:#111;}
.price{font-weight:bold; font-size:14px; color:#333; margin-top:2px;}

/* 2. छोटा और ठीक आगे लगा हुआ गोल 'X' डिलीट बटन */
.del{
 background:#d00 !important;
 color:white !important;
 width:28px !important;
 height:28px !important;
 border-radius:50% !important;
 font-size:14px !important;
 font-weight:bold !important;
 display:flex !important;
 align-items:center !important;
 justify-content:center !important;
 margin:0 !important;
 padding:0 !important;
}
</style>
</head>
<body>
<div class="box">
<h2>Purchase Price Finder</h2>
<input id="model" placeholder="Model">
<input id="price" type="number" placeholder="Purchase Price ₹">
<button onclick="save()">Save / Update</button>

<!-- 🚀 नया फीचर: एक साथ सबकी कीमत बढ़ाने वाला बॉक्स -->
<div class="boost-section">
  <div class="boost-title">📈 सभी मॉडल्स की कीमत एक साथ बढ़ाएं</div>
  <input id="bulkAmount" type="number" placeholder="कितने रुपये बढ़ाना है? (जैसे: 10 या 20)" style="padding:10px; margin:5px 0;">
  <button class="btn-update-all" onclick="increaseAllPrices()">Update All Prices (+)</button>
</div>

<!-- आईफोन ऐप में 100% काम करने वाला शेयर बटन -->
<button class="btn-pdf" onclick="shareFullList()">Share Full List (WhatsApp)</button>

<input id="search" placeholder="Search Model" oninput="show()">
<div id="list"></div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("prices")||"{}");

function save(){
 let m=document.getElementById("model").value.trim().toUpperCase();
 let p=document.getElementById("price").value.trim();
 if(!m||!p)return alert("Model aur price bharo");
 data[m]=p;
 localStorage.setItem("prices",JSON.stringify(data));
 document.getElementById("model").value="";
 document.getElementById("price").value="";
 show();
}

function show(){
 let q=document.getElementById("search").value.trim().toUpperCase();
 let out="";
 Object.keys(data).filter(m=>m.includes(q)).forEach(m=>{
  out+=`<div class="item">
   <div class="item-details">
    <b class="model-text">${m}</b>
    <span class="price">₹${data[m]}</span>
   </div>
   <button class="del" onclick="del('${m}')">X</button>
  </div>`;
 });
 document.getElementById("list").innerHTML=out;
}

function del(m){
 delete data[m];
 localStorage.setItem("prices",JSON.stringify(data));
 show();
}

// 🔥 जादुई फंक्शन: एक साथ सबमें ₹10 या ₹20 जोड़ने के लिए
function increaseAllPrices() {
 let amount = parseInt(document.getElementById("bulkAmount").value);
 if(!amount || amount <= 0) return alert("कृपया सही रुपये लिखें (जैसे 10 या 20)");
 
 // एक-एक करके सभी मॉडल्स की कीमत में पैसे जोड़ना
 Object.keys(data).forEach(m => {
  let currentPrice = parseInt(data[m]) || 0;
  data[m] = currentPrice + amount; // पुरानी कीमत में नया अमाउंट जोड़ दिया
 });
 
 // डेटाबेस में सेव करना और स्क्रीन अपडेट करना
 localStorage.setItem("prices", JSON.stringify(data));
 document.getElementById("bulkAmount").value = ""; // बॉक्स खाली करना
 show();
 alert(`सभी मॉडल्स की कीमत में ₹${amount} बढ़ा दिए गए हैं!`);
}

function shareFullList() {
 if(Object.keys(data).length === 0) return alert("लिस्ट में कोई मॉडल नहीं है!");
 
 let textMessage = "📝 *Purchase Price List* 📝\n\n";
 Object.keys(data).forEach(m => {
  textMessage += `▪️ *${m}* : ₹${data[m]}\n`;
 });
 
 let whatsappUrl = `https://whatsapp.com{encodeURIComponent(textMessage)}`;
 
 if (navigator.share) {
  navigator.share({
   text: textMessage
  }).catch(err => {
   window.open(whatsappUrl, '_blank');
  });
 } else {
  window.open(whatsappUrl, '_blank');
 }
}

show();
</script>
</body>
</html>
