<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Price Finder</title>
    <style>
        body{font-family:Arial;margin:0;background:#f2f2f2}
        .box{max-width:500px;margin:auto;background:white;padding:20px}
        h2{text-align:center}
        input,button,a{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;display:block;text-align:center}
        input{border:1px solid #ccc}
        button{border:0;background:#111;color:white;font-weight:bold;cursor:pointer}
        .item{padding:12px;margin-top:8px;background:#f9f9f9;border:1px solid #eee}
        .price{font-weight:bold;font-size:18px}
        .del{background:#d00;margin-top:5px;width:100%}
        .btn-share{background:#25D366;color:white;font-size:16px;font-weight:bold;margin-top:15px;text-decoration:none;border-radius:4px}
    </style>
</head>
<body>

<div class="box">
    <h2>Purchase Price Finder</h2>
    <input id="model" placeholder="Model">
    <input id="price" type="number" placeholder="Purchase Price">
    <button onclick="save()">Save / Update</button>
    <input id="search" placeholder="Search Model" onkeyup="searchModel()">
    <div id="list"></div>
    
    <!-- बटन को डायरेक्ट लिंक (Anchor Tag) में बदल दिया है ताकि iPhone/Safari में भी 100% काम करे -->
    <a id="whatsappBtn" class="btn-share" href="#" onclick="shareOnWhatsApp(event)">🟢 पूरी लिस्ट WhatsApp पर भेजें</a>
</div>

<script>
var list = [];
if(localStorage.getItem("list") != null){
    list = JSON.parse(localStorage.getItem("list"));
    show();
}

function save(){
    var m = document.getElementById("model").value.trim();
    var p = document.getElementById("price").value.trim();
    if(m == "" || p == ""){
        alert("Enter Model & Price");
        return;
    }
    var f = 0;
    for(var i=0; i<list.length; i++){
        if(list[i].model.toLowerCase() == m.toLowerCase()){
            list[i].price = p;
            f = 1;
        }
    }
    if(f == 0){
        list.push({model:m, price:p});
    }
    localStorage.setItem("list", JSON.stringify(list));
    show();
    document.getElementById("model").value = "";
    document.getElementById("price").value = "";
}

function show(){
    var h = "";
    for(var i=list.length-1; i>=0; i--){
        h += "<div class='item'><b>"+list[i].model+"</b><br><span class='price'>₹"+parseFloat(list[i].price).toLocaleString('en-IN')+"</span><br><button class='del' onclick='del("+i+")'>Delete</button></div>";
    }
    document.getElementById("list").innerHTML = h;
}

function del(i){
    if(confirm("Delete this item?")){
        list.splice(i,1);
        localStorage.setItem("list", JSON.stringify(list));
        show();
    }
}

function searchModel(){
    var s = document.getElementById("search").value.toLowerCase();
    var h = "";
    for(var i=list.length-1; i>=0; i--){
        if(list[i].model.toLowerCase().includes(s)){
            h += "<div class='item'><b>"+list[i].model+"</b><br><span class='price'>₹"+parseFloat(list[i].price).toLocaleString('en-IN')+"</span><br><button class='del' onclick='del("+i+")'>Delete</button></div>";
        }
    }
    document.getElementById("list").innerHTML = h;
}

// नया फिक्स्ड फंक्शन जो सीधे WhatsApp ऐप को ओपन करेगा
function shareOnWhatsApp(e) {
    if (list.length === 0) {
        alert("आपकी लिस्ट खाली है!");
        e.preventDefault();
        return;
    }

    var message = "📋 *परचेज PRICE लिस्ट*\n";
    message += "-----------------------------------\n";

    var total = 0;

    for (var i = 0; i < list.length; i++) {
        message += (i + 1) + ". *" + list[i].model + "* - ₹" + parseFloat(list[i].price).toLocaleString('en-IN') + "\n";
        total += parseFloat(list[i].price);
    }

    message += "-----------------------------------\n";
    message += "💰 *कुल टोटल:* ₹" + total.toLocaleString('en-IN') + "\n\n";
    message += "_यह लिस्ट परचेज प्राइस फाइंडर ऐप से शेयर की गई है।_";

    // सीधे href बदल कर ओपन करने का तरीका (Iphone/Safari फ्रेंडली)
    var whatsappUrl = "whatsapp://send?text=" + encodeURIComponent(message);
    
    // अगर नॉर्मल ब्राउज़र है तो वेब लिंक पर फॉल बैक करें
    var btn = document.getElementById("whatsappBtn");
    btn.href = whatsappUrl;
}
</script>

</body>
</html>
